name: Weekly Vegas props

on:
  workflow_dispatch:

jobs:
  vegas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 1. Player stats (nflverse)
        run: python fetch_stats.py
      - name: 2. Props (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_props.py
      - name: 3. Model
        run: python model.py
      - uses: actions/upload-artifact@v4
        with:
          name: vegas-data
          path: data/
