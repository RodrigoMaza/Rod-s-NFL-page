name: Weekly Vegas props

on:
  schedule:
    - cron: "43 13 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vegas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 1. Player stats (nflverse)
        run: python fetch_stats.py
      - name: 2. Props (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_props.py
      - name: 3. Model
        run: python model.py
      - name: 4. Build page
        run: python build_site.py
      - name: 5. Publish
        run: |
          git config user.name "nfl-page-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs history
          git commit -m "Weekly update: $(date -u +%Y-%m-%d)" || echo "Nothing changed"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: vegas-data
          path: data/
